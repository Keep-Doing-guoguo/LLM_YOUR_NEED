<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="500" viewBox="0 0 1220 500">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  <style>.title{font:700 24px Arial,sans-serif;fill:#0f172a}.h{font:700 16px Arial,sans-serif;fill:#0f172a}.t{font:400 13px Arial,sans-serif;fill:#334155}.box{rx:8;stroke:#334155;stroke-width:1.4}.img{fill:#dbeafe}.adapt{fill:#fef3c7}.llm{fill:#dcfce7}.out{fill:#fee2e2}.line{stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="1220" height="500" fill="#fff"/><text x="34" y="42" class="title">Qwen-VL / Qwen2-VL Architecture</text>
  <g transform="translate(55 120)"><rect class="box img" width="165" height="82"/><text x="35" y="34" class="h">Image</text><text x="24" y="58" class="t">photo, document, UI</text></g>
  <g transform="translate(55 275)"><rect class="box img" width="165" height="82"/><text x="40" y="34" class="h">Video</text><text x="28" y="58" class="t">sampled frames</text></g>
  <line x1="222" y1="161" x2="292" y2="210" class="line"/><line x1="222" y1="316" x2="292" y2="250" class="line"/>
  <g transform="translate(310 170)"><rect class="box img" width="205" height="118"/><text x="38" y="35" class="h">Vision Encoder</text><text x="28" y="66" class="t">ViT / window attention</text><text x="28" y="91" class="t">patch visual features</text></g>
  <line x1="518" y1="229" x2="590" y2="229" class="line"/>
  <g transform="translate(605 150)"><rect class="box adapt" width="220" height="158"/><text x="34" y="35" class="h">Visual Adapter</text><text x="28" y="65" class="t">project / compress</text><text x="28" y="90" class="t">dynamic resolution</text><text x="28" y="115" class="t">MRoPE position info</text><text x="28" y="140" class="t">visual tokens</text></g>
  <line x1="828" y1="229" x2="900" y2="229" class="line"/>
  <g transform="translate(915 150)"><rect class="box llm" width="210" height="158"/><text x="46" y="35" class="h">Qwen LLM</text><text x="28" y="65" class="t">visual tokens + text</text><text x="28" y="90" class="t">autoregressive decode</text><text x="28" y="115" class="t">OCR / VQA / reasoning</text></g>
  <line x1="1020" y1="310" x2="1020" y2="370" class="line"/>
  <g transform="translate(795 385)"><rect class="box out" width="450" height="70"/><text x="26" y="30" class="h">Outputs</text><text x="26" y="53" class="t">text answer, OCR result, bounding boxes, region descriptions, actions</text></g>
  <g transform="translate(310 55)"><rect class="box adapt" width="515" height="48"/><text x="22" y="30" class="t">Qwen2-VL adds dynamic visual token counts; Qwen2.5-VL strengthens video and document understanding.</text></g>
</svg>
