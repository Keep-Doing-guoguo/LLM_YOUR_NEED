<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  <style>.title{font:700 24px Arial,sans-serif;fill:#0f172a}.h{font:700 16px Arial,sans-serif;fill:#0f172a}.t{font:400 13px Arial,sans-serif;fill:#334155}.box{rx:8;stroke:#334155;stroke-width:1.4}.data{fill:#dbeafe}.model{fill:#dcfce7}.loss{fill:#fef3c7}.line{stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
  <rect width="1180" height="520" fill="#fff"/><text x="34" y="42" class="title">Multimodal Training Tasks</text>
  <g transform="translate(60 105)"><rect class="box data" width="220" height="290"/><text x="28" y="35" class="h">Training Data</text><text x="28" y="72" class="t">image-caption pairs</text><text x="28" y="105" class="t">VQA samples</text><text x="28" y="138" class="t">OCR documents</text><text x="28" y="171" class="t">region-box data</text><text x="28" y="204" class="t">video QA</text><text x="28" y="237" class="t">instruction dialogs</text></g>
  <line x1="282" y1="250" x2="365" y2="250" class="line"/>
  <g transform="translate(380 105)"><rect class="box model" width="250" height="290"/><text x="32" y="35" class="h">Vision-Language Model</text><text x="32" y="72" class="t">vision encoder</text><text x="32" y="105" class="t">projector / adapter</text><text x="32" y="138" class="t">LLM</text><text x="32" y="171" class="t">text generation head</text><text x="32" y="204" class="t">optional box interface</text></g>
  <line x1="632" y1="250" x2="715" y2="250" class="line"/>
  <g transform="translate(730 75)"><rect class="box loss" width="365" height="350"/><text x="30" y="35" class="h">Objectives</text><text x="30" y="76" class="t">ITC: image-text contrastive alignment</text><text x="30" y="116" class="t">ITM: image-text matching</text><text x="30" y="156" class="t">LM: caption / answer generation</text><text x="30" y="196" class="t">OCR: text reading supervision</text><text x="30" y="236" class="t">Grounding: phrase-to-box alignment</text><text x="30" y="276" class="t">SFT: multimodal instruction following</text><text x="30" y="316" class="t">Video: temporal reasoning supervision</text></g>
</svg>
