<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 24px Arial, sans-serif;fill:#0f172a}
      .sub{font:400 13px Arial, sans-serif;fill:#475569}
      .box{rx:8;fill:#f8fafc;stroke:#334155;stroke-width:1.4}
      .a{fill:#e0f2fe}.b{fill:#dcfce7}.c{fill:#fef3c7}.d{fill:#ede9fe}.e{fill:#fee2e2}.f{fill:#fce7f3}
      .h{font:700 16px Arial, sans-serif;fill:#0f172a}
      .t{font:400 12px Arial, sans-serif;fill:#334155}
      .line{stroke:#334155;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="36" y="42" class="title">Multimodal Model Evolution</text>
  <text x="36" y="66" class="sub">From image-text alignment to multimodal agents</text>

  <g transform="translate(38 105)">
    <rect class="box a" width="160" height="120"/>
    <text x="18" y="32" class="h">2021</text>
    <text x="18" y="58" class="h">CLIP / ALIGN</text>
    <text x="18" y="84" class="t">contrastive learning</text>
    <text x="18" y="104" class="t">shared embedding space</text>
  </g>
  <line x1="205" y1="165" x2="245" y2="165" class="line"/>
  <g transform="translate(252 105)">
    <rect class="box b" width="160" height="120"/>
    <text x="18" y="32" class="h">2022</text>
    <text x="18" y="58" class="h">BLIP</text>
    <text x="18" y="84" class="t">caption + VQA</text>
    <text x="18" y="104" class="t">understand + generate</text>
  </g>
  <line x1="419" y1="165" x2="459" y2="165" class="line"/>
  <g transform="translate(466 105)">
    <rect class="box c" width="170" height="120"/>
    <text x="18" y="32" class="h">2023</text>
    <text x="18" y="58" class="h">BLIP-2 / Flamingo</text>
    <text x="18" y="84" class="t">connect vision to LLM</text>
    <text x="18" y="104" class="t">Q-Former / cross-attn</text>
  </g>
  <line x1="643" y1="165" x2="683" y2="165" class="line"/>
  <g transform="translate(690 105)">
    <rect class="box d" width="170" height="120"/>
    <text x="18" y="32" class="h">2023</text>
    <text x="18" y="58" class="h">LLaVA / MiniGPT-4</text>
    <text x="18" y="84" class="t">instruction tuning</text>
    <text x="18" y="104" class="t">visual chat</text>
  </g>
  <line x1="867" y1="165" x2="907" y2="165" class="line"/>
  <g transform="translate(914 105)">
    <rect class="box e" width="210" height="120"/>
    <text x="18" y="32" class="h">2023-2025</text>
    <text x="18" y="58" class="h">Qwen-VL / InternVL</text>
    <text x="18" y="84" class="t">OCR, grounding, video</text>
    <text x="18" y="104" class="t">dynamic resolution</text>
  </g>

  <g transform="translate(252 280)">
    <rect class="box f" width="690" height="86"/>
    <text x="22" y="32" class="h">2024+ Multimodal RAG and Agents</text>
    <text x="22" y="58" class="t">retrieval over documents/images/videos + GUI observation + tool execution + action planning</text>
  </g>
  <line x1="1019" y1="228" x2="780" y2="276" class="line"/>
</svg>
