<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">VOC COCO YOLO bbox format comparison</title>
  <desc id="desc">Comparison of bounding box coordinate representations used by VOC, COCO, and YOLO.</desc>
  <rect width="960" height="360" fill="#f7f8fa"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #1f2933; }
    .panel { fill: #ffffff; stroke: #d7dde5; stroke-width: 2; }
    .image { fill: #eef3f8; stroke: #b8c4d4; stroke-width: 2; }
    .box { fill: rgba(47, 111, 237, 0.12); stroke: #2f6fed; stroke-width: 3; }
    .guide { stroke: #8795a8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 14px; }
    .coord { font-size: 15px; font-weight: 700; fill: #2f6fed; }
  </style>

  <g transform="translate(30 30)">
    <rect class="panel" width="280" height="300" rx="8"/>
    <text class="label" x="24" y="36">VOC</text>
    <text class="small" x="24" y="62">(xmin, ymin, xmax, ymax)</text>
    <rect class="image" x="35" y="86" width="210" height="160"/>
    <rect class="box" x="85" y="126" width="115" height="78"/>
    <line class="guide" x1="85" y1="86" x2="85" y2="246"/>
    <line class="guide" x1="35" y1="126" x2="245" y2="126"/>
    <line class="guide" x1="200" y1="86" x2="200" y2="246"/>
    <line class="guide" x1="35" y1="204" x2="245" y2="204"/>
    <text class="coord" x="72" y="119">xmin, ymin</text>
    <text class="coord" x="157" y="224">xmax, ymax</text>
    <text class="small" x="24" y="278">Absolute pixel corners</text>
  </g>

  <g transform="translate(340 30)">
    <rect class="panel" width="280" height="300" rx="8"/>
    <text class="label" x="24" y="36">COCO</text>
    <text class="small" x="24" y="62">[x, y, width, height]</text>
    <rect class="image" x="35" y="86" width="210" height="160"/>
    <rect class="box" x="85" y="126" width="115" height="78"/>
    <line class="guide" x1="85" y1="86" x2="85" y2="246"/>
    <line class="guide" x1="35" y1="126" x2="245" y2="126"/>
    <line class="guide" x1="200" y1="126" x2="200" y2="204"/>
    <line class="guide" x1="85" y1="204" x2="200" y2="204"/>
    <text class="coord" x="78" y="119">x, y</text>
    <text class="small" x="118" y="222">width</text>
    <text class="small" x="208" y="170" transform="rotate(90 208 170)">height</text>
    <text class="small" x="24" y="278">Absolute pixel origin plus size</text>
  </g>

  <g transform="translate(650 30)">
    <rect class="panel" width="280" height="300" rx="8"/>
    <text class="label" x="24" y="36">YOLO</text>
    <text class="small" x="24" y="62">class_id cx cy w h</text>
    <rect class="image" x="35" y="86" width="210" height="160"/>
    <rect class="box" x="85" y="126" width="115" height="78"/>
    <line class="guide" x1="142.5" y1="86" x2="142.5" y2="246"/>
    <line class="guide" x1="35" y1="165" x2="245" y2="165"/>
    <circle cx="142.5" cy="165" r="5" fill="#d64545"/>
    <text class="coord" x="151" y="160">cx, cy</text>
    <text class="small" x="115" y="222">w, h normalized</text>
    <text class="small" x="24" y="278">Normalized center plus size</text>
  </g>
</svg>
